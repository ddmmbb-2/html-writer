<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>院內課程公告</title><style id="writer-style">
:root{
  color-scheme:light;
  --sans:Arial,"Helvetica Neue","Liberation Sans","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC","Noto Sans TC","WenQuanYi Zen Hei",sans-serif;
  --serif:"Times New Roman","Liberation Serif","Songti TC",PMingLiU,"Noto Serif CJK TC","Noto Serif TC",serif;
  --mono:"Courier New","Liberation Mono",Menlo,"DejaVu Sans Mono","Noto Sans Mono CJK TC","PingFang TC","Microsoft JhengHei",monospace;
  --ink:#23312b;--muted:#56645b;--edge:#dce2da;--green:#235943;--wash:#e8efe8;
  --page-width:210mm;--page-height:297mm;--page-margin:18mm;
  font:14px "Inter","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  color:var(--ink);background:#eaede7
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button,input,select{min-height:34px;padding:5px 9px;border:1px solid var(--edge);border-radius:7px;background:white}
button:hover,select:hover{background:var(--wash)}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid #387254;outline-offset:2px}
.primary,.primary:hover{background:var(--green);border-color:var(--green);color:white}
.chrome,.preview-bar{position:sticky;top:0;z-index:5;background:#fbfcf9;box-shadow:0 1px 0 #ccd7cc}
.top,.tools,.group,.identity,.actions,.context,.preview-bar{display:flex;align-items:center;gap:6px}
.top,.tools,.context,.preview-bar{padding:9px clamp(10px,3vw,28px)}
.top,.preview-bar{justify-content:space-between}
.top,.actions,.tools,.context,.preview-bar{flex-wrap:wrap}
.identity{gap:9px}
.mark{display:grid;place-items:center;width:33px;height:37px;border-radius:7px;background:var(--green);color:white;font-weight:700}
.identity label{display:block;color:var(--muted);font-size:11px}
#file-name{background:none;border-color:transparent;min-height:24px;width:clamp(130px,28vw,270px);padding:2px;font-weight:700}
.tools,.context{border-top:1px solid var(--edge)}
.group{padding-right:6px;border-right:1px solid var(--edge)}
.group:last-child{border:0;padding-right:0}
.context{background:#edf2eb}
#image-free-tools{display:contents}
#image-free-tools input[type="number"]{width:5.2em}
#free-image-picker{max-width:13em;text-overflow:ellipsis}
#color{width:32px;min-height:33px;padding:3px}
.workspace{max-width:1160px;margin:auto;padding:24px 16px;display:grid;grid-template-columns:160px minmax(0,var(--page-width));gap:22px;justify-content:center}
.outline{position:sticky;top:180px;align-self:start}
.outline h2{margin:6px 0 8px;font-size:13px}
.outline nav{display:grid}
.outline button{background:transparent;border-color:transparent;text-align:left;overflow-wrap:anywhere}
.outline button:hover{background:#dbe7db}
.outline button[data-level="3"]{padding-left:19px}
.document-area{min-width:0}
.paper-frame,.sheet-area{--image-inset:0px}
.paper-frame{--image-inset:var(--page-margin);position:relative}
#paper{position:relative;isolation:isolate;overflow:clip;min-height:var(--page-height);background:white;border-radius:3px;padding:var(--image-inset);box-shadow:0 7px 28px #25392614}
#paper:focus{outline:none;box-shadow:0 0 0 1px #a8bda9,0 7px 28px #25392614}
.doc{display:flow-root;min-width:0;color:#26312b;font:12pt/1.65 var(--sans);overflow-wrap:anywhere}
.doc [face="WriterSans"],.doc [style*="WriterSans"]{font-family:var(--sans)!important}
.doc [face="WriterSerif"],.doc [style*="WriterSerif"]{font-family:var(--serif)!important}
.doc [face="WriterMono"],.doc [style*="WriterMono"]{font-family:var(--mono)!important}
.doc h1,.doc h2,.doc h3{line-height:1.28;scroll-margin-top:180px}
.doc h1{font-size:28pt;margin:.25em 0 .46em;letter-spacing:-.022em}
.doc h2{font-size:16pt;margin:1.2em 0 .38em;color:#244f3e}
.doc h3{font-size:13pt;margin:1em 0 .35em}
.doc p,.doc ul,.doc ol{margin:.5em 0 .85em}
.doc ul,.doc ol{padding-inline-start:1.6em}
.doc ol{list-style-type:decimal!important}
.doc ol ol{list-style-type:lower-alpha!important}
.doc ol ol ol{list-style-type:lower-roman!important}
.doc ol>li{list-style-type:inherit!important}
.doc li>ol,.doc li>ul{margin-block:.15em .2em}
.doc .meta{color:#42634f;font-size:10pt;font-weight:700;letter-spacing:.08em}
.doc .lead{color:#546259}
.doc hr{margin:6mm 0;border:none;border-top:1px solid var(--edge)}
.doc a{color:#185d49;text-underline-offset:3px}
.doc img{max-width:100%;max-height:230mm;height:auto;object-fit:contain;vertical-align:middle}
.doc img[data-selected]:not([data-image-layer]){outline:2px solid #47896b;outline-offset:3px}
.doc img[data-image-layer],#image-controls{
  position:absolute;
  left:calc(var(--image-inset) + (100% - 2 * var(--image-inset)) * var(--image-x));
  top:calc(var(--image-inset) + var(--image-y));
  width:calc((100% - 2 * var(--image-inset)) * var(--image-width));
  transform:rotate(var(--image-angle))
}
.doc img[data-image-layer]{
  z-index:1;
  max-height:none;
  opacity:var(--image-opacity);
  user-select:none
}
.doc img[data-image-layer="behind"]{z-index:-1;pointer-events:none}
[data-mode="edit"] #paper img[data-image-layer="front"]{cursor:move;touch-action:none}
#paper img[data-image-layer][data-selected],#image-controls{
  width:calc((100% - 2 * var(--image-inset)) * var(--image-drag-width,var(--image-width)));
  transform:rotate(var(--image-drag-angle,var(--image-angle)));
  translate:var(--image-drag-x,0px) var(--image-drag-y,0px)
}
#image-controls{z-index:2;pointer-events:none;outline:1px solid #47896b;box-shadow:0 0 0 1px #ffffffb3}
#image-controls[data-overflows-start]{pointer-events:auto;cursor:move;touch-action:none}
#image-controls button{
  position:absolute;transform:translate(-50%,-50%);width:32px;min-height:32px;padding:0;
  border-color:var(--green);background:white;color:var(--green);font-size:18px;line-height:1;
  touch-action:none;pointer-events:auto
}
#move-image{left:0;top:0;cursor:move}
#resize-image{left:100%;top:100%;cursor:nwse-resize}
#rotate-image{left:50%;top:-34px;cursor:grab}
#rotate-image:active{cursor:grabbing}
#rotate-image::after{content:"";position:absolute;top:100%;left:50%;height:19px;border-left:1px solid #47896b;pointer-events:none}
.doc table{width:100%;border-collapse:collapse;table-layout:fixed;margin:.8em 0;font-size:.93em}
.doc td,.doc th{padding:6px 9px;text-align:left;vertical-align:top;border:1px solid #d5dfd5}
.doc th{background:#e7efe7;color:#244f3e}
[data-mode="edit"] #paper [data-cell-selected]{background:#d5e9f9;box-shadow:inset 0 0 0 2px #3b76a3}
#table-tools [aria-pressed="true"]{background:#d5e9f9;border-color:#3b76a3}
.table-hint{color:var(--muted);font-size:12px}
#column-controls{position:absolute;inset:0;z-index:1;pointer-events:none}
#column-controls .column-grip{
  position:absolute;width:12px;min-height:0;transform:translateX(-50%);padding:0;border:0;border-radius:0;
  background:transparent;pointer-events:auto;cursor:col-resize;touch-action:none
}
#column-controls .column-grip:not(:disabled):is(:hover,:focus-visible)::after,#column-guide{
  position:absolute;width:2px;background:#3b76a3;pointer-events:none
}
#column-controls .column-grip::after{content:"";inset:0 auto 0 5px}
#column-guide{transform:translateX(-50%)}
.doc .continued{margin-top:0}
.doc .continuing{margin-bottom:0}
.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:9px 1px}
#preview{display:none}
[data-preview="true"] #preview{display:block}
[data-preview="true"] .chrome,[data-preview="true"] .workspace{display:none}
.preview-bar{padding-block:11px}
.preview-bar strong{font-size:15px}
#preview-note{margin:0;padding:10px 15px;text-align:center;color:var(--muted);font-size:13px}
#sheets{padding:8px 10px 26px}
.sheet{width:var(--page-width);height:var(--page-height);position:relative;overflow:hidden;margin:0 auto 18px;background:white;box-shadow:0 6px 28px #25392626;zoom:var(--preview-zoom,1)}
#sheets.measuring .sheet{zoom:1}
.sheet-area{position:absolute;isolation:isolate;top:var(--page-margin);left:var(--page-margin);right:var(--page-margin);bottom:var(--page-margin);overflow:hidden}
.page-number{position:absolute;bottom:11mm;left:var(--page-margin);right:var(--page-margin);text-align:right;color:#57655b;font:9pt var(--sans)}
.scaled-slot{position:relative;overflow:hidden}
.scaled-content{position:absolute;inset:0 0 auto;transform-origin:top left;display:flow-root}
dialog{width:min(400px,calc(100% - 24px));padding:18px;border:1px solid var(--edge);border-radius:12px;color:var(--ink)}
dialog::backdrop{background:#18292266}
dialog h2{margin:0 0 12px;font-size:18px}
dialog label{display:grid;gap:4px;margin:8px 0}
dialog input{width:100%}
.dialog-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
#error{color:#97332d;font-size:13px;min-height:1em}
@media screen and (max-width:780px){.workspace{display:block;padding:13px 10px}.outline{display:none}.paper-frame{--image-inset:clamp(22px,8vw,68px)}}
@media screen and (max-width:550px){.tools,.group{gap:4px}.tools .group,#table-tools .group{max-width:100%;flex-wrap:wrap;padding-right:4px}.tools button,.tools select{font-size:12px;max-width:100%}}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{margin:0!important;padding:0!important;background:white!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chrome,.workspace,.preview-bar,#preview-note,dialog{display:none!important}
  #preview{display:block!important}
  #sheets{margin:0;padding:0}
  /* Only the outer sheet allows rounding tolerance. Inner width, height and typography match preview. */
  #sheets .sheet{margin:0;box-shadow:none;zoom:1;height:296.7mm;break-inside:avoid;break-after:page}
  #sheets .sheet:last-child{break-after:auto}
  #sheets .sheet-area{bottom:17.7mm}
  #sheets .page-number{bottom:10.7mm}
}

  $("preview-note").textContent = t("printSettings") + (result.scaledCount ? " " + t("scaledItems") : "");
  fitPreview();
  printReady = true;
}
async function preview() {
  remember();
  chooseImage(null);
  columnSizing.activate(null);
  const ticket = ++previewTicket;
  app.dataset.preview = "true";
  $("preview-note").textContent = t("paginating");
  $("page-count").textContent = "";
  $("print").disabled = $("pdf").disabled = true;
  let timer;
  try {
    const images = Array.from(paper.querySelectorAll("img"),image => image.decode().catch(() => {}));
    await Promise.race([Promise.all([document.fonts?.ready,...images]),new Promise(resolve => { timer = setTimeout(resolve,2200); })]);
    if (ticket !== previewTicket) return false;
    buildPreview();
    window.scrollTo(0,0);
    $("back").focus({preventScroll:true});
    return true;
  } finally {
    clearTimeout(timer);
    if (ticket === previewTicket) $("print").disabled = $("pdf").disabled = false;
  }
}
function leavePreview() {
  previewTicket++;
  delete app.dataset.preview;
  $("open-preview").focus();
  syncContext();
}
function output(kind) {
  if (!printReady) buildPreview();
  $("preview-note").textContent = (kind === "pdf" ? t("choosePdf") + " " : "") + t("printSettings");
  window.print();
}
window.addEventListener("beforeprint",() => {
  columnSizing.activate(null);
  if (app.dataset.preview !== "true") {
    app.dataset.preview = "true";
    nativePreview = true;
  }
  if (!printReady) buildPreview();
});
window.addEventListener("afterprint",() => {
  if (nativePreview) { delete app.dataset.preview; syncContext(); }
  nativePreview = false;
});
window.addEventListener("resize",fitPreview);

document.addEventListener("selectionchange",() => { if (editing) { remember(); syncContext(); } });
document.addEventListener("keydown",event => {
  if (dialog.open) return;
  if (event.key === "Escape" && columnSizing.cancel()) { event.preventDefault(); return; }
  if (event.key === "Escape" && app.dataset.preview === "true") leavePreview();
  if (tableEditing.hasSelection() && (event.key === "Escape" || (paper.contains(event.target)
    && !event.ctrlKey && !event.metaKey && (event.key.length === 1 || /^(Arrow|Backspace|Delete|Enter|Home|End)/.test(event.key))))) {
    tableEditing.clear();
    syncContext();
  }
  if (!(event.ctrlKey || event.metaKey)) return;
  const key = event.key.toLowerCase();
  if (editing && (paper.contains(event.target) || $("image-controls").contains(event.target)
    || $("column-controls").contains(event.target)) && (key === "z" || key === "y")) {
    event.preventDefault();
    editHistory.step(key === "y" || event.shiftKey ? 1 : -1);
    return;
  }
  if (key === "s") { event.preventDefault(); saveHTML(); }
  if (key === "p") {
    event.preventDefault();
    if (app.dataset.preview !== "true") preview().then(ready => { if (ready) output("print"); });
    else if (!$("print").disabled) output("print");
  }
});
for (const name of ["tools","table-tools"]) {
  $(name).addEventListener("pointerdown",event => {
    remember();
    if (event.target.closest("button")) event.preventDefault();
  });
}
$("tools").addEventListener("click",event => {
  const button = event.target.closest("button");
  if (!button || button.disabled) return;
  const {command,listLevel} = button.dataset;
  if (command) issue(command);
  if (listLevel && editing && selection && editHistory.perform(() => listLevels.move(selection,listLevel))) {
    changed();
    syncContext();
  }
});
for (const [name,command] of [["format","formatBlock"],["font","fontName"],["alignment",null]]) {
  $(name).addEventListener("change",event => {
    const value = event.target.value;
    if (value) issue(command || value,command ? value : null);
    event.target.selectedIndex = 0;
  });
}
$("color").addEventListener("change",event => issue("foreColor",event.target.value));
$("table-tools").addEventListener("click",event => {
  const action = event.target.closest("[data-table]")?.dataset.table;
  if (action) tableEditing.change(action);
});
$("image-width").addEventListener("change",event => changeImage(event.target.value));
$("remove-image").addEventListener("click",() => changeImage());
paper.addEventListener("beforeinput",editHistory.beforeInput);
paper.addEventListener("input",event => {
  if (!editHistory.input(event)) return;
  tableEditing.clear();
  if (selectedImage && !paper.contains(selectedImage)) chooseImage(null);
  remember(); changed(); syncContext();
});
paper.addEventListener("click",event => {
  if (!editing) return;
  if (event.target.closest("a")) event.preventDefault();
  if (!tableEditing.hasSelection()) chooseImage(event.target.closest("img"));
});
paper.addEventListener("paste",event => {
  if (!editing || !event.clipboardData) return;
  event.preventDefault();
  remember();
  const image = Array.from(event.clipboardData.files).find(file => imageMime.test(file.type));
  if (image) insertImage(image);
  else issue("insertText",event.clipboardData.getData("text/plain"));
});
paper.addEventListener("drop",event => {
  if (!editing) return;
  event.preventDefault();
  const file = Array.from(event.dataTransfer.files).find(item => imageMime.test(item.type));
  if (file) insertImage(file);
});
$("outline").addEventListener("click",event => {
  const target = event.target.closest("button");
  if (target) paper.querySelectorAll(headings)[Number(target.dataset.index)]?.scrollIntoView({block:"start"});
});
$("form").addEventListener("submit",event => {
  event.preventDefault();
  if (dialogType === "new") { dialog.close(); blankDocument(); return; }
  if (dialogType === "table") {
    const rows = Number($("rows").value), columns = Number($("columns").value);
    if (!Number.isInteger(rows) || !Number.isInteger(columns) || rows < 1 || rows > 30 || columns < 1 || columns > 8) {
      $("error").textContent = t("invalidTable");
      return;
    }
    dialog.close(); insertTable(rows,columns); return;
  }
  let url;
  try { url = new URL($("link-url").value.trim()); } catch {}
  if (!url || !["http:","https:"].includes(url.protocol)) {
    $("error").textContent = t("invalidUrl");
    return;
  }
  const link = make("a");
  link.href = url.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = $("link-text").value.trim() || url.href;
  dialog.close();
  issue("insertHTML",link.outerHTML);
});
$("cancel").addEventListener("click",() => dialog.close());
$("add-link").addEventListener("click",() => openDialog("link"));
$("add-table").addEventListener("click",() => openDialog("table"));
$("add-image").addEventListener("click",() => { remember(); $("image-file").click(); });
$("image-file").addEventListener("change",event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (file) insertImage(file);
});
fileName.addEventListener("input",changed);
$("language").addEventListener("change",event => {
  locale.change(event.target.value);
  document.title = actualName();
  printReady = false;
  $("mode").textContent = t(editing ? "readMode" : "editMode");
  updateOutline();
  freeImages.refreshPicker();
  columnSizing.refresh();
  status();
});
$("mode").addEventListener("click",() => mode(!editing));
$("new-file").addEventListener("click",() => snapshot() === saved ? blankDocument() : openDialog("new"));
$("save-html").addEventListener("click",saveHTML);
$("open-preview").addEventListener("click",preview);
$("back").addEventListener("click",leavePreview);
$("print").addEventListener("click",() => output("print"));
$("pdf").addEventListener("click",() => output("pdf"));
locale.apply(locale.preference);
saved = snapshot();
mode(app.dataset.mode !== "read");
editHistory.reset();
changed();
})();
</script></body></html>
